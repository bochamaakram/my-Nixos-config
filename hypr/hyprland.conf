# --- PROGRAMS ---
$terminal = kitty
$fileManager = nautilus
$menu = ~/.config/rofi/rofi-apps
$powerMenu = /home/akram/.config/rofi/powermenu.sh

# --- AUTOSTART ---
exec-once = hyprlock
# Start the cliphist daemon
exec-once = wl-paste --type text --watch cliphist store 
exec-once = wl-paste --type image --watch cliphist store
exec-once = hypridle
exec-once = swww-daemon
exec-once = swww init
exec-once = waypaper --restore
exec-once = wal -R -t 
exec-once = qs -c hyprstar
exec-once = qs -c overview
exec-once = /run/current-system/sw/libexec/polkit-gnome-authentication-agent-1
exec-once = elephant &
exec-once = wal -R
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'Adwaita-dark'
exec-once = nm-applet --indicator &
exec-once = blueman-applet &

# --- INPUT & GESTURES ---
input {
    kb_layout = fr
    kb_variant = azerty
    follow_mouse = 1
    sensitivity = 0.2 

    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# Correct block for v0.54.3
gesture = 3, horizontal, workspace
gesture = 3, down, mod: ALT, close
gesture = 3, up, mod: SUPER, scale: 1.5, fullscreen

# --- LOOK & FEEL (Dark Mode) ---
general { 
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(333333ee) rgba(111111ee) 45deg
    col.inactive_border = rgba(1a1a1aaa)
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 0.95
    inactive_opacity = 0.75
    
    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 15
        render_power = 4
        color = rgba(000000ee)
    }
}

# --- KEYBINDINGS ---
$mainMod = SUPER

bind = $mainMod, L, exec, hyprlock
blurls = rofi
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, W, killactive, 
bind = $mainMod, F, exec, $fileManager
bind = $mainMod, P, exec, ~/.config/rofi/rofi-pass.sh
bind = $mainMod, V, exec, ~/.config/rofi/rofi-clipboard.sh
bind = $mainMod, R, exec, ~/.config/rofi/rofi-apps
bind = $mainMod, Space, exec, $menu

# Flatpak App Launches
bind = $mainMod, B, exec, flatpak run com.brave.Browser
bind = $mainMod, S, exec, flatpak run com.brave.Browser --app=https://app.slack.com/client/T05TMCR3RLK/C0ANTNQVCKV --enable-features=UseOzonePlatform --ozone-platform=wayland

# --- SCREENSHOTS ---
$screenshot = /home/akram/.config/rofi/screenshot.sh
bind = $mainMod, Print, exec, $screenshot
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy && dunstify "Screenshot copied to clipboard"

# --- Volume Control ---
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ && dunstify -e -h string:x-canonical-private-synchronous:volume -a "System" "Volume: $(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print int($2 * 100)}' )"
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && dunstify -e -h string:x-canonical-private-synchronous:volume -a "System" "Volume: $(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print int($2 * 100)}' )"
bind  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && dunstify -e -h string:x-canonical-private-synchronous:volume -a "System" "Mute Toggled"

# --- Brightness Control ---
binde = , XF86MonBrightnessUp, exec, brightnessctl set 5%+ && dunstify -e -h string:x-canonical-private-synchronous:brightness -a "System" "Brightness: $(brightnessctl -m | cut -d, -f4)"
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%- && dunstify -e -h string:x-canonical-private-synchronous:brightness -a "System" "Brightness: $(brightnessctl -m | cut -d, -f4)"

# --- Wifi / Network ---
bind = $mainMod SHIFT, W, exec, dunstify -a "Network" "Connected to:" "$(nmcli -t -f active,ssid dev wifi | grep '^yes' | cut -d: -f2)"

# Overview toggle
bind = Super, TAB, exec, qs ipc -c overview call overview toggle

# Notification Management (Quickshell hyprstar config)
bind = $mainMod, N, exec, qs ipc -c hyprstar call notifications dnd_toggle
bind = $mainMod SHIFT, N, exec, qs ipc -c hyprstar call notifications dismiss_all

# Power Menu (Quickshell hyprstar config)
bind = $mainMod, X, exec, qs ipc -c hyprstar call powermenu toggle

# Maximize (Keeps bars/gaps visible)
bind = $mainMod SHIFT, F, fullscreen, 1
bind = $mainMod SHIFT, right, movetoworkspace, e+1
bind = $mainMod SHIFT, left, movetoworkspace, e-1

# --- Battery (Important Action) ---
exec-once = while true; do if [ $(cat /sys/class/power_supply/BAT0/capacity) -le 20 ]; then dunstify -u critical "Battery Low" "Level: $(cat /sys/class/power_supply/BAT0/capacity)%"; fi; sleep 60; done