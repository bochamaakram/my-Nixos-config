# --- MONITORS ---
monitor=,highres,auto,1

# --- PROGRAMS ---
$terminal = kitty
$fileManager = nautilus
$menu = rofi -show drun
$powerMenu = wlogout -b 2

# --- AUTOSTART ---
exec-once = swww-daemon        # Start the backend
exec-once = aether --daemon    # Start Aether in the background
exec-once = swww init
exec-once = waypaper --restore
exec-once = wal -R -t 
exec-once = waybar
exec-once = dunst
exec-once = elephant &
exec-once = walker --gapplication-service &
exec-once = wal -R
# Force GTK apps (Nautilus) to Dark Mode
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'Adwaita-dark' # or your preferred dark theme
exec-once = nm-applet --indicator &
exec-once = blueman-applet &
# Import pywal colors for Hyprland borders
source = ~/.cache/wal/colors-hyprland.conf

general {
    $color1 = rgb(ff5555)
    $color2 = rgb(ff5555)
    $background = rgb(ff5555)
    col.active_border = $color1 $color2 45deg
    col.inactive_border = $background
}

# --- INPUT & GESTURES ---
input {
    kb_layout = fr
    kb_variant = azerty
    follow_mouse = 1
    sensitivity = 0.2 

    touchpad {
        natural_scroll = true
        tap-to-click = true
        # In v0.50+, gestures are often nested here or in a specific block
        # If the standalone gestures block fails, we keep it simple:
    }
}

# Correct block for v0.54.3
gesture = 3, horizontal, workspace
gesture = 3, down, mod: ALT, close
gesture = 3, up, mod: SUPER, scale: 1.5, fullscreen

# --- LOOK & FEEL (Dark Mode) ---
general { 
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(333333ee) rgba(111111ee) 45deg
    col.inactive_border = rgba(1a1a1aaa)
    layout = dwindle
}


decoration {
    rounding = 10
    active_opacity = 0.95
    inactive_opacity = 0.85
    
    # Ensure there is no 'blur = true' line outside of this sub-block
    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 15
        render_power = 4
        color = rgba(000000ee)
    }
}


# --- KEYBINDINGS ---
$mainMod = SUPER
# In your keybinds section
bind = $mainMod, X, exec, wlogout -b 5 -T 300 -B 300 
bind = $mainMod, L, exec, hyprlock

blurls = wlogout

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, W, killactive, 
bind = $mainMod, M, exit, 
bind = $mainMod, B, exec, brave 
bind = $mainMod, F, exec, $fileManager
bind = $mainMod, V, togglefloating, 
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, 
bind = $mainMod, J, togglesplit, 
bind = $mainMod, Space, exec, walker

bind = , Print, exec, grim -g "$(slurp)" - | wl-copy

# Move focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4

# Move active window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2

# Laptop Keys (ThinkPad L390)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-