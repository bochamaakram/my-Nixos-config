# --- MONITORS ---
monitor=,highres,auto,1

# --- PROGRAMS ---
$terminal = kitty
$fileManager = nautilus
$menu = ~/.config/rofi/rofi-apps
$powerMenu = /home/akram/.config/rofi/powermenu.sh
# --- AUTOSTART ---
exec-once = hyprlock
# Start the cliphist daemon
exec-once = wl-paste --type text --watch cliphist store 
exec-once = wl-paste --type image --watch cliphist store
exec-once = hypridle
exec-once = swww-daemon
exec-once = aether --daemon
exec-once = swww init
exec-once = waypaper --restore
exec-once = wal -R -t 
exec-once = waybar
exec-once = dunst
exec-once = /run/current-system/sw/libexec/pokil-gnome-authentication-agent-1
exec-once = elephant &
exec-once = wal -R
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'Adwaita-dark'
exec-once = nm-applet --indicator &
exec-once = blueman-applet &

general {
    $color1 = rgb(ff5555)
    $color2 = rgb(ff5555)
    $background = rgb(ff5555)
    col.active_border = $color1 $color2 45deg
    col.inactive_border = $background
}

# --- INPUT & GESTURES ---
input {
    kb_layout = fr
    kb_variant = azerty
    follow_mouse = 1
    sensitivity = 0.2 

    touchpad {
        natural_scroll = true
        tap-to-click = true
        # In v0.50+, gestures are often nested here or in a specific block
        # If the standalone gestures block fails, we keep it simple:
    }
}

# Correct block for v0.54.3
gesture = 3, horizontal, workspace
gesture = 3, down, mod: ALT, close
gesture = 3, up, mod: SUPER, scale: 1.5, fullscreen

# --- LOOK & FEEL (Dark Mode) ---
general { 
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(333333ee) rgba(111111ee) 45deg
    col.inactive_border = rgba(1a1a1aaa)
    layout = dwindle
}


decoration {
    rounding = 10
    active_opacity = 0.95
    inactive_opacity = 0.75
    
    # Ensure there is no 'blur = true' line outside of this sub-block
    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 15
        render_power = 4
        color = rgba(000000ee)
    }
}


# --- KEYBINDINGS ---
$mainMod = SUPER

bind = $mainMod, X, exec, bash /home/akram/.config/rofi/powermenu.sh 
bind = $mainMod, L, exec, hyprlock
blurls = rofi

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, S, exec, chromium --app=https://app.slack.com/client/T05TMCR3RLK/C0ANTNQVCKV --enable-features=UseOzonePlatform --ozone-platform=wayland
bind = $mainMod, W, killactive, 
bind = $mainMod, B, exec, brave 
bind = $mainMod, F, exec, $fileManager
bind = $mainMod, P, exec, ~/.config/rofi/rofi-pass.sh
bind = $mainMod, V, exec, ~/.config/rofi/rofi-clipboard.sh
bind = $mainMod, R, exec, ~/.config/rofi/rofi-apps
bind = $mainMod, Space, exec, $menu
# --- SCREENSHOTS ---
$screenshot = /home/akram/.config/rofi/screenshot.sh
#layerrule = blur, rofi
bind = $mainMod, Print, exec, $screenshot
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot copied to clipboard"

# --- Volume Control ---
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ && dunstify -h string:x-dunst-stack-tag:volume -a "System" "Volume: $(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print int($2 * 100)}' )"
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && dunstify -h string:x-dunst-stack-tag:volume -a "System" "Volume: $(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print int($2 * 100)}' )"
bind  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && dunstify -h string:x-dunst-stack-tag:volume -a "System" "Mute Toggled"

# --- Brightness Control ---
binde = , XF86MonBrightnessUp, exec, brightnessctl set 5%+ && dunstify -h string:x-dunst-stack-tag:brightness -a "System" "Brightness: $(brightnessctl -m | cut -d, -f4)"
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%- && dunstify -h string:x-dunst-stack-tag:brightness -a "System" "Brightness: $(brightnessctl -m | cut -d, -f4)"

# --- Wifi / Network ---
# This triggers a notification showing your current SSID
bind = $mainMod SHIFT, N, exec, dunstify -a "Network" "Connected to:" "$(nmcli -t -f active,ssid dev wifi | grep '^yes' | cut -d: -f2)"

# --- Battery (Important Action) ---
# Add this to your autostart to check battery every minute
exec-once = while true; do if [ $(cat /sys/class/power_supply/BAT0/capacity) -le 20 ]; then notify-send -u critical "Battery Low" "Level: $(cat /sys/class/power_supply/BAT0/capacity)%"; fi; sleep 60; done