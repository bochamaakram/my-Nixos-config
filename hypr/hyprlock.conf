source = $HOME/.cache/wal/colors-hyprland.conf

general {
    no_fade_in = false
    grace = 0
    disable_loading = true
}

background {
    monitor =
    path = /home/akram/.cache/current_wallpaper
    blur_size = 3
    blur_passes = 3
    noise = 0.0117
    contrast = 1.3
    brightness = 0.8
    vibrancy = 0.21
    vibrancy_darkness = 0.0
}

# --- BIG TIME (Top Center) ---
# Hours
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H")"
    color = $color6
    font_size = 180  # Made slightly larger for impact
    font_family = Geist Mono SemiBold
    position = 0, 200
    halign = center
    valign = center
}

# Minutes
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%M")"
    color = $color7 # Changed to secondary color for variety
    font_size = 180
    font_family = Geist Mono SemiBold
    position = 0, 0
    halign = center
    valign = center
}

# --- DATE (Below Minutes) ---
label {
    monitor =
    text = cmd[update:43200000] echo "<b>$(date +'%A, %d %B')</b>"
    color = $color7
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    position = 0, -140 
    halign = center
    valign = center
}

# --- INPUT FIELD (Bottom Center) ---
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = $color6
    
    fade_on_empty = true # Looks cleaner as a screensaver
    rounding = 20
    check_color = $color2
    fail_color = $color1
    
    placeholder_text = <i><span font_family="Geist Mono">Locked</span></i>
    hide_input = false
    position = 0, -250
    halign = center
    valign = center
}
