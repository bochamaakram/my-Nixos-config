general {
    # This ensures hyprlock is ready to go
    lock_cmd = pidof hyprlock || hyprlock       
    # Lock the screen BEFORE the laptop goes to sleep/suspend
    before_sleep_cmd = loginctl lock-session    
    # Turn the screen back on when the laptop wakes up
    after_sleep_cmd = hyprctl dispatch dpms on  
}

# --- STAGE 1: Dim the screen (after 2.5 minutes) ---
listener {
    timeout = 150                                
    # Save the current brightness and dim to 10%
    on-timeout = brightnessctl -s set 10%         
    # Restore the previous brightness on activity
    on-resume = brightnessctl -r                 
}

# --- STAGE 2: Lock the screen (after 5 minutes) ---
listener {
    timeout = 300                                
    on-timeout = loginctl lock-session           
}

# --- STAGE 3: Turn off the screen (after 5.5 minutes) ---
# This saves significant battery on your ThinkPad
listener {
    timeout = 330                                
    on-timeout = hyprctl dispatch dpms off       
    on-resume = hyprctl dispatch dpms on         
}

# --- STAGE 4: Suspend/Sleep (after 10 minutes) ---
# Only triggers if the laptop is left completely alone
listener {
    timeout = 600                                
    on-timeout = systemctl suspend                
}

# In ~/.config/hypr/hypridle.conf
listener {
    timeout = 300 # 5 minutes of fish
    on-timeout = hyprctl dispatch dpms off # Then kill the display to save power
}